        const masjid = Number(settings.MasjidMonthly || 50);
        const madrasha = Number(settings.MadrashaMonthly || 50);
        const waz = Number(settings.WazMahfil || 500);

        let wazStartYear = "",
          wazEndYear = "";
        if (settings.WazMahfilStartDate) {
          const match = settings.WazMahfilStartDate.match(/\d{4}/);
          if (match) wazStartYear = match[0];
        }
        if (settings.WazMahfilEndDate) {
          const match = settings.WazMahfilEndDate.match(/\d{4}/);
          if (match) wazEndYear = match[0];
        }

        let isWazDateLocked = false;
        let wazStartStr = settings.WazMahfilStartDate || "";
        let wazEndStr = settings.WazMahfilEndDate || "";
        let wazStart = null,
          wazEnd = null;

        if (wazStartStr) {
          const match = wazStartStr.match(
            /^(\d{1,2})\s+([A-Za-z]+),?\s+(\d{4})/,
          );
          if (match) {
            const mIdx = MONTH_NAMES.findIndex(
              (m) => m.toLowerCase() === match[2].toLowerCase(),
            );
            if (mIdx !== -1)
              wazStart = new Date(Number(match[3]), mIdx, Number(match[1]));
          }
        }
        if (wazEndStr) {
          const match = wazEndStr.match(/^(\d{1,2})\s+([A-Za-z]+),?\s+(\d{4})/);

            const mIdx = MONTH_NAMES.findIndex(
              (m) => m.toLowerCase() === match[2].toLowerCase(),

      function updateCollectionTotal() {
        const masjid = $("collectMasjid")?.checked || false;
        const madrasha = $("collectMadrasha")?.checked || false;
        const waz = $("collectWaz")?.checked || false;

        const masjidCard = $("masjidCard"),
          masjidDetails = $("masjidDetails");
        if (masjid) {
          masjidCard?.classList.add("active");
          masjidDetails?.classList.remove("hidden");
          const monthly = Number($("masjidMonthlyAmount")?.value || 0),
            months = Number($("masjidMonths")?.value || 1);
          if ($("masjidAmount")) $("masjidAmount").value = monthly * months;
        } else {
          masjidCard?.classList.remove("active");
          masjidDetails?.classList.add("hidden");
          if ($("masjidAmount")) $("masjidAmount").value = 0;
        }

        const madrashaCard = $("madrashaCard"),
          madrashaDetails = $("madrashaDetails");
        if (madrasha) {
          madrashaCard?.classList.add("active");
          madrashaDetails?.classList.remove("hidden");
          const monthly = Number($("madrashaMonthlyAmount")?.value || 0),
            months = Number($("madrashaMonths")?.value || 1);
          if ($("madrashaAmount")) $("madrashaAmount").value = monthly * months;
        } else {
          madrashaCard?.classList.remove("active");
          madrashaDetails?.classList.add("hidden");
          if ($("madrashaAmount")) $("madrashaAmount").value = 0;
        }

        if ($("wazCard")) {
          const wazCard = $("wazCard"),
            wazDetails = $("wazDetails");
          if (waz) {
            wazCard?.classList.add("active");
            wazDetails?.classList.remove("hidden");
          } else {
            wazCard?.classList.remove("active");
            wazDetails?.classList.add("hidden");
          }

          const wazNormal = Number($("wazNormalAmount")?.value || 0),
            wazPaid = Number($("wazAmount")?.value || 0);
          const wazReasonBox = $("wazReasonBox");
          if (waz && wazPaid > 0 && wazPaid < wazNormal) {
            wazReasonBox?.classList.remove("hidden");
          } else {
            wazReasonBox?.classList.add("hidden");
            if ($("wazUnlockReason")) $("wazUnlockReason").value = "";
          }
        }

        const masjidAmount = masjid ? Number($("masjidAmount")?.value || 0) : 0;
        const madrashaAmount = madrasha
          ? Number($("madrashaAmount")?.value || 0)
          : 0;
        const wazAmount =
          waz && $("collectWaz") ? Number($("wazAmount")?.value || 0) : 0;
        const total = masjidAmount + madrashaAmount + wazAmount;

        let detailsHtml = "";
        if (masjidAmount > 0)
          detailsHtml += `<div style="display:flex; justify-content:space-between; margin-bottom:2px; font-size:12px; font-weight:500;"><span>🕌 Masjid</span><span>${money(masjidAmount)}</span></div>`;
        if (madrashaAmount > 0)
          detailsHtml += `<div style="display:flex; justify-content:space-between; margin-bottom:2px; font-size:12px; font-weight:500;"><span>🏫 Madrasha</span><span>${money(madrashaAmount)}</span></div>`;
        if (wazAmount > 0)
          detailsHtml += `<div style="display:flex; justify-content:space-between; margin-bottom:2px; font-size:12px; font-weight:500;"><span>🎤 Waz Mahfil</span><span>${money(wazAmount)}</span></div>`;

        const totalBox = $("collectionTotalBox");
        if (totalBox) {
          totalBox.innerHTML = `
                  <div style="width: 100%; display: flex; flex-direction: column;">

                    <div style="display: flex; flex-direction: column; margin-bottom: 4px;">
                      ${detailsHtml}
                    </div>

                    ${detailsHtml ? `<div style="border-bottom: 1.5px dashed rgba(255,255,255,0.3); margin: 2px 0 8px 0;"></div>` : ""}

                    <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 4px;">
                      <span class="total-label" style="font-size: 18px; font-weight: 800;">Total Collection</span>
                      <span class="total-amount" style="font-size: 28px; font-weight: 800;">${money(total)}</span>
                    </div>

                  </div>
                `;
        }
      }

      async function submitNewCollection(family) {
        const collections = [];
        if ($("collectMasjid")?.checked) {
          const months = Math.max(1, Number($("masjidMonths").value || 1)),
            monthly = Number($("masjidMonthlyAmount").value || 0);
          const required = monthly * months,
            amount = Number($("masjidAmount").value || 0);
          if (isNaN(amount) || amount < required) {
            toast(
              "Masjid amount must be at least " + money(required) + ".",
              "error",
            );
            return;
          }
          collections.push({
            category: "Masjid",
            monthsCovered: months,
            amount: amount,
            unlockReason: "",
          });
        }
        if ($("collectMadrasha")?.checked) {
          const months = Math.max(1, Number($("madrashaMonths").value || 1)),
            monthly = Number($("madrashaMonthlyAmount").value || 0);
          const required = monthly * months,
            amount = Number($("madrashaAmount").value || 0);
          if (isNaN(amount) || amount < required) {
            toast(
              "Madrasha amount must be at least " + money(required) + ".",
              "error",
            );
            return;
          }
          collections.push({
            category: "Madrasha",
            monthsCovered: months,
            amount: amount,
            unlockReason: "",
          });
        }
        if ($("collectWaz")?.checked) {
          const normal = Number($("wazNormalAmount").value || 0),
            amount = Number($("wazAmount").value || 0);
          const reason = $("wazUnlockReason")?.value.trim() || "";
          if (isNaN(amount) || amount <= 0) {
            toast("Enter a valid Waz Mahfil amount.", "error");
            return;
          }
          if (amount < normal && !reason) {
            toast(
              "Reason is required when Waz Mahfil amount is less than normal amount.",
              "error",
            );
            return;
          }

          let wazStartYear = "",
            wazEndYear = "";
          try {
            const settings = await api("getSettings", [token]);
            if (settings.WazMahfilStartDate) {
              const match = settings.WazMahfilStartDate.match(/\d{4}/);
              if (match) wazStartYear = match[0];
            }
            if (settings.WazMahfilEndDate) {
              const match = settings.WazMahfilEndDate.match(/\d{4}/);
              if (match) wazEndYear = match[0];
            }
          } catch (e) { }

          collections.push({
            category: "Waz Mahfil",
            monthsCovered: 1,
            amount: amount,
            unlockReason: reason,
            wazStartYear: wazStartYear,
            wazEndYear: wazEndYear,
          });
        }
        if (!collections.length) {
          toast("Select at least one collection category.", "error");
          return;
        }
        if (collections.reduce((s, i) => s + i.amount, 0) <= 0) {
          toast("Enter a valid collection amount.", "error");
          return;
        }

        const saveBtn = document.querySelector(
          '#modalFooter button[onclick*="submitNewCollection"]',
        );
        const oldBtnHTML = saveBtn ? saveBtn.innerHTML : "";

        try {
          if (saveBtn) {
            saveBtn.disabled = true;
            saveBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite; display:inline-block; vertical-align:middle; margin-right:6px;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg> Saving...`;
          }

          const result = await api("submitCollection", [
            token,
            {
              familyID: family.familyID,
              collections: collections,
              paymentType: "Cash",
            },
          ]);

          closeModal();
          toast("Collection saved successfully.", "success");

          if (result && result.receipt) {
            result.receipt.collections.forEach((col, index) => {
              if (col.category === "Waz Mahfil") {
                col.wazStartYear = collections[index].wazStartYear;
                col.wazEndYear = collections[index].wazEndYear;
              }
            });
            showReceipt(result.receipt);
          }
        } catch (error) {
          if (saveBtn) {
            saveBtn.disabled = false;
            saveBtn.innerHTML = oldBtnHTML;
          }
          handleApiError(error);
        }
      }

                        <div style="font-size:11px;color:var(--muted);margin-top:4px;">Display: <b>${esc(toCustomDateString(startDate) || "Not Set")}</b></div>
                      </div>
                      <div class="form-group">
                        <label>End Date</label>
                        <input id="setting_WazMahfilEndDate" type="date" class="form-control" value="${toInputDateValue(endDate)}">
                        <div style="font-size:11px;color:var(--muted);margin-top:4px;">Display: <b>${esc(toCustomDateString(endDate) || "Not Set")}</b></div>
                      </div>
                    `
            : ""
          }

                    <div class="live-meta">
                      <span>${period}</span>
                    </div>

                    <button class="btn btn-primary" style="margin-top:12px" onclick="saveSetting('${key}','${title}','${period}', ${key === "WazMahfil" ? "true" : "false"})">
                      💾 <span>Save</span>
                    </button>
                  </div>
                </div>
              `;
      }

      async function saveSetting(key, title, period, isWaz = false) {
        const value = Number($(`setting_${key}`).value);
        if (value < 0) {
          toast("Invalid amount.", "error");
          return;
        }

        const btn = document.querySelector(`button[onclick*="saveSetting('${key}'"]`);
        const oldBtnHTML = btn ? btn.innerHTML : "";

        try {
          if (btn) {
            btn.disabled = true;
            btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite; display:inline-block; vertical-align:middle; margin-right:6px;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg> Saving...`;
          }

          await api("updateSetting", [
            token,
            key,
            value,
            `${title} ${period} collection`,
          ]);

          if (isWaz) {
            const startVal = toCustomDateString($("setting_WazMahfilStartDate").value);
            const endVal = toCustomDateString($("setting_WazMahfilEndDate").value);

            await api("updateSetting", [
              token,
              "WazMahfilStartDate",
              startVal,
              "Waz Mahfil Start Date",
            ]);
            await api("updateSetting", [
              token,
              "WazMahfilEndDate",
              endVal,
              "Waz Mahfil End Date",
            ]);
          }

          toast(`${title} setting updated successfully.`, "success");

        } catch (error) {
          handleApiError(error);
        } finally {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = oldBtnHTML;
            updateLanguage();
          }
        }
      }

      async function renderLogs() {
        $("mainContent").innerHTML = `
                <div class="page-title">
                  <div>
                    <h2>📋 Activity Logs</h2>
                    <p>System activity history.</p>
                  </div>
                  <button class="btn btn-light" onclick="renderLogs()">↻ <span>Refresh</span></button>
                </div>
                <div class="card"><div id="logsContainer" class="card-body"><div style="text-align:left; padding-left: 20px; color: var(--text);">Loading<span class="dot-1">.</span><span class="dot-2">.</span><span class="dot-3">.</span></div></div></div>
              `;
        updateLanguage();
        try {
          const logs = await api("getActivityLogs", [token, 500]);
          cachedLogsResults = logs || [];
          logsPage = 1;
          renderLogsPage();
        } catch (error) {
          handleApiError(error);
        }
      }

      function renderLogsPage() {
        const container = $("logsContainer");
        if (!cachedLogsResults || !cachedLogsResults.length) {
          container.innerHTML = `<div class="empty">No logs found.</div>`;
          updateLanguage();
          return;
        }

        const totalPages =
          Math.ceil(cachedLogsResults.length / LOGS_PER_PAGE) || 1;
        if (logsPage > totalPages) logsPage = totalPages;
        if (logsPage < 1) logsPage = 1;

        const startIdx = (logsPage - 1) * LOGS_PER_PAGE;
        const paginated = cachedLogsResults.slice(
          startIdx,
          startIdx + LOGS_PER_PAGE,
        );

        container.innerHTML = `
                <div class="table-wrap">
                  <table>
                    <thead><tr><th>#</th><th>Time</th><th>Admin</th><th>Role</th><th>Action</th><th>Description</th></tr></thead>
                    <tbody>
                      ${paginated
            .map((log, idx) => {
              const serial = startIdx + idx + 1;
              return `<tr>
                          <td>${serial}</td>
                          <td>${esc(log.timestamp)}</td>
                          <td>${esc(log.adminName)}</td>
                          <td>${esc(log.role)}</td>
                          <td><span class="badge badge-info">${esc(log.action)}</span></td>
                          <td>${esc(log.description)}</td>
                        </tr>`;
            })
            .join("")}
                    </tbody>
                  </table>
                </div>
                ${renderPaginationHTML("logs", logsPage, totalPages, cachedLogsResults.length)}
              `;
        updateLanguage();
      }

      // ================================================================
      // 21. MODAL & ERROR HANDLERS
      // ================================================================
      function openModal(title, body, footer) {
        $("modalTitle").textContent = title;
        $("modalBody").innerHTML = body;
        $("modalFooter").innerHTML = footer || "";
        $("modal").classList.add("show");
        updateLanguage();
      }

      function closeModal() {
        $("modal").classList.remove("show");
      }

      function handleApiError(error) {
        console.error("API Error:", error);
        const message = error.message || "Something went wrong.";
        if (message === "SESSION_INVALID" || message === "ACCOUNT_INACTIVE") {
          logout();
          toast("Your session has expired. Please login again.", "error");
          return;
        }
        toast(message, "error");
      }

      function toggleActionDropdown(event) {
        event.stopPropagation();
        const dropdown = document.getElementById("actionDropdownMenu");
        if (dropdown) dropdown.classList.toggle("show");
      }

      function closeActionDropdown() {
        const dropdown = document.getElementById("actionDropdownMenu");
        if (dropdown) dropdown.classList.remove("show");
      }

      document.addEventListener("click", function (event) {
        const dropdown = document.getElementById("actionDropdownMenu");
        const btn = document.querySelector(".custom-dropdown > button");
        if (dropdown && dropdown.classList.contains("show")) {
          if (
            !dropdown.contains(event.target) &&
            (!btn || !btn.contains(event.target))
          ) {
            dropdown.classList.remove("show");
          }
        }
      });

      // ================================================================
      // 22. INITIALIZATION & SESSION RESTORE
      // ================================================================
      async function restoreSession() {
        loadTheme();
        updateLanguage();

        if (!token || !currentAdmin) {
          $("adminPage").classList.add("hidden");
          $("loginPage").classList.remove("hidden");
          return;
        }

        try {
          $("loginPage").classList.add("hidden");
          $("adminPage").classList.remove("hidden");
          const session = await api("checkSession", [token]);
          currentAdmin = session.admin;
          sessionStorage.setItem(
            "sadanandapur_admin",
            JSON.stringify(currentAdmin),
          );
          initializeAdminUI();
          updateLanguage();
          toast("Session restored.", "success");
        } catch (error) {
          sessionStorage.clear();
          token = "";
          currentAdmin = null;
          $("adminPage").classList.add("hidden");
          $("loginPage").classList.remove("hidden");
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        restoreSession();

        // Bind global window functions
        window.toggleTheme = toggleTheme;
        window.login = login;
        window.logout = logout;
        window.navigate = navigate;
        window.toggleSidebar = toggleSidebar;
        window.renderDashboard = renderDashboard;
        window.renderCollection = renderCollection;
        window.renderFamilies = renderFamilies;
        window.renderMembers = renderMembers;
        window.renderAdmins = renderAdmins;
        window.renderSettings = renderSettings;
        window.renderLogs = renderLogs;
        window.searchCollectionFamily = searchCollectionFamily;
        window.openCollectionForm = openCollectionForm;
        window.updateCollectionTotal = updateCollectionTotal;
        window.submitNewCollection = submitNewCollection;
        window.openFamilyForm = openFamilyForm;
        window.saveFamily = saveFamily;
        window.loadMembers = loadMembers;
        window.openMemberForm = openMemberForm;
        window.saveMember = saveMember;
        window.openAdminForm = openAdminForm;
        window.createAreaAdmin = createAreaAdmin;
        window.toggleAdmin = toggleAdmin;
        window.confirmToggleAdmin = confirmToggleAdmin;
        window.openResetPasswordModal = openResetPasswordModal;
        window.confirmResetPassword = confirmResetPassword;
        window.openEditAdminForm = openEditAdminForm;
        window.saveEditAdmin = saveEditAdmin;
        window.saveSetting = saveSetting;
        window.showMonthlyPayment = showMonthlyPayment;
        window.showHistoryReceipt = showHistoryReceipt;
        window.downloadReceiptJPG = downloadReceiptJPG;
        window.downloadHistoryReceiptJPG = downloadHistoryReceiptJPG;
        window.closeModal = closeModal;
        window.modalOutside = modalOutside;
        window.togglePasswordVisibility = togglePasswordVisibility;
        window.openModal = openModal;
        window.isSuperAdmin = isSuperAdmin;
        window.money = money;
        window.esc = esc;
        window.escMobile = escMobile;
        window.toast = toast;
        window.api = api;
        window.renderFamilyTable = renderFamilyTable;
        window.toggleCategory = toggleCategory;
        window.formatBangladeshDate = formatBangladeshDate;
        window.showReceipt = showReceipt;
        window.openExcelImport = openExcelImport;
        window.previewExcelImport = previewExcelImport;
        window.submitExcelImport = submitExcelImport;
        window.changePage = changePage;
        window.toggleFamilyStatus = toggleFamilyStatus;
        window.confirmFamilyStatus = confirmFamilyStatus;
        window.toggleExcelNotice = toggleExcelNotice;
        window.updateFileName = updateFileName;
        window.showInactiveNotice = showInactiveNotice;
        window.toCustomDateString = toCustomDateString;
        window.toInputDateValue = toInputDateValue;
        window.calculateAge = calculateAge;
        window.renderHistory = renderHistory;
        window.loadHistory = loadHistory;
      });
    </script>
