<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Sadanandapur Management System</title>
  <link rel="icon" type="image/png" href="logo.svg">

  <!-- ================================================================ -->
  <!-- GOOGLE FONTS                                                     -->
  <!-- ================================================================ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- ================================================================ -->
  <!-- EXTERNAL LIBRARIES (JPG Download & Excel Import)                 -->
  <!-- ================================================================ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>

  <style>
    /* ================================================================
       1. CSS VARIABLES & THEMES (Light & Dark Mode)
       ================================================================ */
    :root {
      --primary: #4f46e5;
      --primary2: #4338ca;
      --success: #10b981;
      --danger: #f43f5e;
      --warning: #f59e0b;
      --info: #38bdf8;
      --dark: #0f172a;
      --text: #0f172a;
      --muted: #64748b;

      --bg: #e5f0ff;
      --card: rgba(255, 255, 255, 0.85);
      --border: rgba(0, 0, 0, 0.12);

      --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
      --radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --primary: #6366f1;
      --primary2: #818cf8;
      --success: #10b981;
      --danger: #f43f5e;
      --warning: #f59e0b;
      --info: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;

      --bg: #0b1120;
      --card: rgba(17, 24, 39, 0.7);
      --border: rgba(255, 255, 255, 0.15);

      --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    /* ================================================================
       2. GLOBAL STYLES
       ================================================================ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Exo 2", "Hind Siliguri", sans-serif;
      transition:
        background 0.3s ease,
        color 0.3s ease;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      outline: none;
    }

    .hidden {
      display: none !important;
    }

    .container {
      width: min(1400px, 94%);
      margin: auto;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    /* ================================================================
       3. TOPBAR & BRANDING
       ================================================================ */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      transition: var(--transition);
    }

    [data-theme="dark"] .topbar {
      background: rgba(17, 24, 39, 0.85);
    }

    .topbar-inner {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      font-size: 22px;
      box-shadow: 0 8px 16px -4px rgba(79, 70, 229, 0.4);
      flex-shrink: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .brand small {
      color: var(--muted);
      font-weight: 500;
      font-size: 12px;
    }

    /* ================================================================
       4. BUTTONS
       ================================================================ */
    .btn {
      border: 0;
      border-radius: 12px;
      padding: 10px 18px;
      font-weight: 600;
      font-size: 14px;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #6366f1);
      color: #fff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--success), #34d399);
      color: #fff;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--danger), #fb7185);
      color: #fff;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
    }

    .btn-warning {
      background: linear-gradient(135deg, var(--warning), #fbbf24);
      color: #fff;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
    }

    .btn-light {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .btn-light:hover {
      background: var(--bg);
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 12px;
      border-radius: 9px;
    }

    /* ================================================================
       5. PUBLIC HERO SECTION
       ================================================================ */
    .hero {
      padding: 40px 0 24px;
    }

    .hero-box {
      border-radius: 28px;
      padding: 45px;
      color: #fff;
      background:
        radial-gradient(circle at 90% 10%,
          rgba(255, 255, 255, 0.2),
          transparent 40%),
        linear-gradient(135deg, #4f46e5, #6366f1, #9333ea);
      box-shadow: 0 20px 40px -10px rgba(79, 70, 229, 0.4);
      position: relative;
      overflow: hidden;
    }

    .hero-box h2 {
      margin: 0 0 10px;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .hero-box p {
      margin: 0;
      opacity: 0.95;
      font-size: 16px;
      font-weight: 500;
    }

    /* ================================================================
       6. CARDS & STATS
       ================================================================ */
    .card {
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    .card:hover {
      box-shadow: 0 12px 40px -10px rgba(79, 70, 229, 0.2);
    }

    .card-header {
      padding: 22px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .card-header h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .card-body {
      padding: 24px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin: 24px 0;
    }

    .stat {
      padding: 24px;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      transition: var(--transition);
    }

    .stat:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 30px -10px rgba(79, 70, 229, 0.1);
    }

    .stat-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
      margin-top: 6px;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--text), var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ================================================================
       7. GRID LAYOUTS
       ================================================================ */
    .grid {
      display: grid;
      gap: 20px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    /* ================================================================
       8. LIVE COLLECTION LIST
       ================================================================ */
    .live-list {
      max-height: 430px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .live-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      transition: var(--transition);
    }

    .live-row:hover {
      padding-left: 4px;
      padding-right: 4px;
      background: var(--bg);
      border-radius: 10px;
    }

    .live-row:last-child {
      border-bottom: 0;
    }

    .live-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(5, 150, 105, 0.15);
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0% {
        box-shadow: 0 0 0 0 rgba(5, 150, 105, 0.4);
      }

      70% {
        box-shadow: 0 0 0 8px rgba(5, 150, 105, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(5, 150, 105, 0);
      }
    }

    .live-meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
      font-weight: 500;
    }

    .live-amount {
      font-size: 17px;
      font-weight: 800;
      color: var(--primary);
    }

    /* ================================================================
       9. PROGRESS BARS
       ================================================================ */
    .progress-item {
      margin-bottom: 20px;
    }

    .progress-item:last-child {
      margin-bottom: 0;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 14px;
    }

    .progress-track {
      height: 12px;
      border-radius: 30px;
      overflow: hidden;
      background: var(--border);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
    }

    .progress-bar {
      height: 100%;
      border-radius: 30px;
      background: linear-gradient(90deg, var(--primary), #8b5cf6);
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ================================================================
       10. LOGIN SCREEN
       ================================================================ */
    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at 10% 10%,
          rgba(79, 70, 229, 0.08),
          transparent 30%),
        radial-gradient(circle at 90% 90%,
          rgba(139, 92, 246, 0.08),
          transparent 30%),
        var(--bg);
    }

    .login-card {
      width: min(450px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
      border-radius: 28px;
      padding: 40px;
      backdrop-filter: blur(10px);
    }

    .login-logo {
      width: 72px;
      height: 72px;
      margin: auto;
      border-radius: 22px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 32px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      box-shadow: 0 12px 24px -6px rgba(79, 70, 229, 0.4);
    }

    .login-card h2 {
      text-align: center;
      margin: 20px 0 6px;
      font-size: 26px;
      font-weight: 800;
    }

    .login-card p {
      text-align: center;
      color: var(--muted);
      margin-bottom: 24px;
      font-weight: 500;
    }

    /* ================================================================
       11. CUSTOM TOOLTIP
       ================================================================ */
    .custom-tooltip-container {
      position: relative;
      display: inline-block;
      cursor: pointer;
    }

    .custom-tooltip-container .custom-tooltip-text {
      visibility: hidden;
      width: max-content;
      max-width: 250px;
      background-color: var(--card);
      color: var(--text);
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      position: absolute;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      font-size: 12px;
      font-weight: 600;
      pointer-events: none;
      white-space: nowrap;
    }

    .custom-tooltip-container:hover .custom-tooltip-text {
      visibility: visible;
      opacity: 1;
    }

    .custom-tooltip-container .custom-tooltip-text::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: var(--card) transparent transparent transparent;
    }

    /* ================================================================
       12. FORMS & INPUTS
       ================================================================ */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
    }

    .form-control {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: var(--bg);
      color: var(--text);
      transition: var(--transition);
      font-weight: 500;
    }

    .form-control:focus {
      border-color: var(--primary);
      background: var(--card);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }

    .form-control:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .form-control-sm {
      padding: 8px 12px;
      font-size: 13px;
    }

    textarea.form-control {
      resize: vertical;
      min-height: 100px;
    }

    .login-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
    }

    /* ================================================================
       13. ADMIN LAYOUT (SIDEBAR & MAIN CONTENT)
       ================================================================ */
    .app-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: calc(100vh - 76px);
    }

    .sidebar {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-right: 1px solid var(--border);
      padding: 20px 14px;
      position: sticky;
      top: 76px;
      height: calc(100vh - 76px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    [data-theme="dark"] .sidebar {
      background: rgba(17, 24, 39, 0.5);
    }

    .sidebar-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 16px 12px 8px;
    }

    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 0;
      background: transparent;
      color: #475569;
      border-radius: 12px;
      margin: 4px 0;
      text-align: left;
      font-weight: 600;
      font-size: 14px;
      transition: var(--transition);
    }

    [data-theme="dark"] .nav-btn {
      color: var(--muted);
    }

    .nav-btn:hover {
      background: rgba(79, 70, 229, 0.1);
      color: var(--primary);
    }

    [data-theme="dark"] .nav-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    .nav-btn.active {
      background: linear-gradient(135deg, var(--primary), #6366f1);
      color: #fff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    .main-content {
      padding: 30px;
      min-width: 0;
    }

    .page-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .page-title h2 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .page-title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-weight: 500;
      font-size: 14px;
    }

    /* ================================================================
       14. TABLES
       ================================================================ */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
    }

    th,
    td {
      padding: 15px 16px;
      border-bottom: 1px solid var(--border);
      border-right: none;
      text-align: left;
      transition: background-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
    }

    th:last-child,
    td:last-child {
      border-right: none;
    }

    th {
      background: rgba(0, 0, 0, 0.04);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 2px solid var(--border);
    }

    [data-theme="dark"] th {
      background: rgba(255, 255, 255, 0.05);
    }

    tbody tr:hover td {
      background-color: rgba(255, 255, 255, 0.08);
    }

    [data-theme="light"] tbody tr:hover td {
      background-color: rgba(0, 0, 0, 0.1);
    }

    /* ================================================================
       15. BADGES & PAYMENT STATUS
       ================================================================ */
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 30px;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .badge-success {
      background: rgba(5, 150, 105, 0.12);
      color: var(--success);
    }

    .badge-danger {
      background: rgba(225, 29, 72, 0.12);
      color: var(--danger);
    }

    .badge-warning {
      background: rgba(217, 119, 6, 0.12);
      color: var(--warning);
    }

    .badge-info {
      background: rgba(2, 132, 199, 0.12);
      color: var(--info);
    }

    .payment-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .payment-status.paid {
      background: rgba(5, 150, 105, 0.12);
      color: #059669;
    }

    .payment-status.pending {
      background: rgba(217, 119, 6, 0.12);
      color: #d97706;
    }

    /* ================================================================
       16. MODALS
       ================================================================ */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      animation: fade-in 0.2s ease;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(650px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      animation: scale-up 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes scale-up {
      from {
        transform: scale(0.95);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .modal-head {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: var(--card);
      z-index: 1;
      border-radius: 24px 24px 0 0;
    }

    .modal-head h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .modal-body {
      padding: 24px;
    }

    .modal-foot {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: var(--bg);
      border-radius: 0 0 24px 24px;
      position: sticky;
      bottom: 0;
      flex-wrap: wrap;
    }

    /* ================================================================
       17. RECEIPT STYLES
       ================================================================ */
    .receipt {
      max-width: 500px;
      margin: auto;
      background: #ffffff;
      padding: 35px 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      font-family: "Exo 2", "Hind Siliguri", sans-serif;
      color: #1a1a2e;
    }

    .receipt-title {
      text-align: center;
      border-bottom: 2px solid #1a1a2e;
      padding-bottom: 18px;
      margin-bottom: 20px;
    }

    .receipt-title h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      color: #1a1a2e;
      letter-spacing: 0.5px;
    }

    .receipt-title .sub {
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
      margin-top: 4px;
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 8px 0;
      font-size: 14px;
      border-bottom: 1px solid #f1f5f9;
    }

    .receipt-row:last-of-type {
      border-bottom: none;
    }

    .receipt-row .label {
      color: #64748b;
      font-weight: 500;
    }

    .receipt-row .value {
      font-weight: 600;
      color: #1a1a2e;
      text-align: right;
    }

    .receipt-items {
      margin: 20px 0;
      border: 1px solid #f1f5f9;
      border-radius: 12px;
      padding: 15px 20px;
      background: #fafafa;
    }

    .receipt-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed #e8ecf1;
      font-size: 14px;
    }

    .receipt-item:last-child {
      border-bottom: none;
    }

    .receipt-item .item-name {
      font-weight: 600;
    }

    .receipt-item .item-amount {
      font-weight: 700;
      color: var(--primary);
    }

    .receipt-item .item-detail {
      font-size: 12px;
      color: #64748b;
      margin-top: 2px;
    }

    .receipt-total {
      display: flex;
      justify-content: space-between;
      padding: 14px 0 10px;
      border-top: 2px solid #1a1a2e;
      margin-top: 10px;
      font-size: 20px;
      font-weight: 800;
      color: #1a1a2e;
    }

    .receipt-footer {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px dashed #e2e8f0;
    }

    /* ================================================================
       18. TOASTS & EMPTY STATES
       ================================================================ */
    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 9999;
      padding: 14px 20px;
      background: var(--dark);
      color: #fff;
      border-radius: 14px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      transform: translateY(120px);
      opacity: 0;
      transition: var(--transition);
      font-weight: 600;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 400px;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      font-weight: 500;
    }

    .empty div {
      font-size: 45px;
      margin-bottom: 10px;
    }

    /* ================================================================
       19. COLLECTION FORM CATEGORY CARDS
       ================================================================ */
    .collection-category-card {
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 14px;
      transition: var(--transition);
      cursor: pointer;
      background: var(--card);
    }

    .collection-category-card:hover {
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.08);
    }

    .collection-category-card.active {
      border-color: var(--primary);
      background: rgba(79, 70, 229, 0.04);
    }

    .collection-category-card .category-header {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 16px;
    }

    .collection-category-card .category-header input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .collection-category-card .category-badge {
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 20px;
      background: var(--bg);
      color: var(--muted);
      font-weight: 600;
    }

    .collection-category-card .category-details {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .collection-total-box {
      background: linear-gradient(135deg, var(--primary), #6366f1);
      color: #fff;
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
    }

    .collection-total-box .total-label {
      font-size: 16px;
      font-weight: 600;
      opacity: 0.9;
    }

    .collection-total-box .total-amount {
      font-size: 28px;
      font-weight: 800;
    }

    .collection-payment-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 30px;
      background: rgba(2, 132, 199, 0.1);
      color: var(--info);
      font-weight: 600;
      font-size: 13px;
      margin-top: 12px;
    }

    /* ================================================================
       20. MEMBERS HEADER ROW
       ================================================================ */
    .members-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .members-header-row h2 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .members-header-row p {
      margin: 4px 0 0;
      color: var(--muted);
      font-weight: 500;
      font-size: 14px;
    }

    .members-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .members-family-input {
      width: auto;
      min-width: 140px;
      max-width: 180px;
      padding: 10px 14px;
      text-align: left;
    }

    /* ================================================================
       21. PAGINATION
       ================================================================ */
    .pagination-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding: 10px;
      border-top: 1px solid var(--border);
    }

    .pagination-info {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .pagination-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .pagination-page {
      padding: 6px 12px;
      font-weight: 600;
      font-size: 13px;
    }

    /* ================================================================
       22. INACTIVE NOTICE MODAL
       ================================================================ */
    .notice-box {
      text-align: center;
      padding: 10px 0;
    }

    .notice-box .notice-icon {
      font-size: 50px;
      margin-bottom: 12px;
    }

    .notice-box h4 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--danger);
    }

    .notice-box p {
      color: var(--muted);
      font-weight: 500;
      font-size: 14px;
      line-height: 1.6;
    }

    .notice-box .notice-detail {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(225, 29, 72, 0.06);
      border: 1px solid rgba(225, 29, 72, 0.2);
      font-size: 13px;
      font-weight: 600;
      color: var(--danger);
      text-align: left;
    }

    .notice-box .notice-detail div {
      margin-bottom: 4px;
    }

    /* ================================================================
       23. MEDIA QUERIES (Responsive Design)
       ================================================================ */
    .mobile-menu {
      display: none;
    }

    @media (max-width: 1000px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .grid-4 {
        grid-template-columns: repeat(2, 1fr);
      }

      .app-layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        left: -280px;
        top: 76px;
        width: 270px;
        z-index: 300;
        height: calc(100vh - 76px);
        box-shadow: 20px 0 40px rgba(0, 0, 0, 0.2);
        transition: var(--transition);
      }

      .sidebar.open {
        left: 0;
      }

      .mobile-menu {
        display: flex;
      }
    }

    @media (max-width: 700px) {
      .hero-box {
        padding: 30px 20px;
      }

      .hero-box h2 {
        font-size: 26px;
      }

      /* Two-column cards on mobile */
      .stats {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 10px !important;
        margin: 15px 0 !important;
      }

      /* Compact stat cards */
      .stat {
        padding: 12px 10px !important;
        min-height: 100px !important;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .stat-icon {
        font-size: 18px !important;
        margin-bottom: 2px !important;
      }

      .stat-label {
        font-size: 10px !important;
        line-height: 1.2 !important;
      }

      .stat-value {
        font-size: 18px !important;
        margin-top: 4px !important;
      }

      /* Shrink area buttons inside Today's Paid / Total Family cards */
      .stat>div[style*="display: flex; justify-content: space-between"] {
        gap: 2px !important;
        margin-top: 5px !important;
      }

      .stat>div[style*="display: flex; justify-content: space-between"]>div {
        padding: 2px !important;
        min-width: 30px !important;
      }

      .stat>div[style*="display: flex; justify-content: space-between"]>div>div:first-child {
        font-size: 8px !important;
      }

      .stat>div[style*="display: flex; justify-content: space-between"]>div>div:last-child {
        font-size: 12px !important;
      }

      .dashboard-stats-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 10px !important;
      }

      .grid-2,
      .grid-3,
      .grid-4 {
        grid-template-columns: 1fr;
      }

      .main-content {
        padding: 16px;
      }

      .topbar-inner {
        min-height: 64px;
      }

      .brand h1 {
        font-size: 14px;
      }

      .brand small {
        font-size: 10px;
      }

      .top-actions .btn {
        padding: 8px 12px;
        font-size: 12px;
      }

      .hide-mobile {
        display: none;
      }

      .login-card {
        padding: 24px;
      }

      .modal-box {
        width: 100%;
        margin: 10px;
      }

      .receipt {
        padding: 20px;
      }

      .members-header-row {
        flex-direction: column;
        align-items: stretch;
      }

      .members-header-right {
        justify-content: stretch;
        flex-wrap: wrap;
      }

      .members-family-input {
        max-width: none;
        flex: 1;
        text-align: left;
      }

      .table-wrap {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      table {
        min-width: 800px !important;
        width: 100% !important;
        font-size: 11px;
      }

      th,
      td {
        padding: 10px 8px !important;
        white-space: nowrap !important;
        text-align: center !important;
        vertical-align: middle;
      }

      th {
        font-size: 10px;
      }

      .btn-sm {
        padding: 5px 8px !important;
        font-size: 10px !important;
      }

      .table-wrap td div {
        gap: 4px !important;
        flex-wrap: nowrap !important;
        justify-content: center !important;
      }

      .page-title {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .page-title button {
        width: auto;
        padding: 8px 14px;
        font-size: 12px;
      }
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px);
      }

      50% {
        transform: translateX(5px);
      }

      75% {
        transform: translateX(-5px);
      }
    }

    /* ================================================================
       24. PRINT STYLES
       ================================================================ */
    @media print {
      body * {
        visibility: hidden !important;
      }

      #printArea,
      #printArea * {
        visibility: visible !important;
      }

      #printArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: #fff;
        padding: 40px 20px;
      }

      .receipt {
        border: 1px solid #ddd !important;
        box-shadow: none !important;
        max-width: 100% !important;
      }
    }

    /* ================================================================
       25. ANIMATIONS
       ================================================================ */
    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes dot-blink {

      0%,
      100% {
        opacity: 0;
      }

      50% {
        opacity: 1;
      }
    }

    .dot-1 {
      animation: dot-blink 1.4s infinite;
      animation-delay: 0s;
    }

    .dot-2 {
      animation: dot-blink 1.4s infinite;
      animation-delay: 0.2s;
    }

    .dot-3 {
      animation: dot-blink 1.4s infinite;
      animation-delay: 0.4s;
    }

    .custom-tooltip-container {
      position: relative;
      cursor: pointer;
    }

    .custom-tooltip-text {
      visibility: hidden;
      width: max-content;
      max-width: 250px;
      background-color: var(--card);
      color: var(--text);
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      position: absolute;
      z-index: 1000;
      bottom: 150%;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity 0.3s;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      font-size: 12px;
      font-weight: 600;
      pointer-events: none;
      backdrop-filter: blur(10px);
    }

    .custom-tooltip-text::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: var(--card) transparent transparent transparent;
    }

    .custom-tooltip-container:hover .custom-tooltip-text {
      visibility: visible;
      opacity: 1;
    }

    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear {
      display: none;
    }

    input[type="password"]::-webkit-textfield-decoration-container,
    input[type="password"]::-webkit-credentials-auto-fill-button {
      display: none !important;
    }
  </style>
</head>

  <div id="loginPage" class="hidden" style="

    <style>
      @keyframes float {

        50% {

        100% {
          transform: translateY(0px) scale(1);
        }
      }

      @keyframes float-reverse {

          transform: translateY(0px) scale(1);

        }

        100% {
          transform: translateY(0px) scale(1);
        }

          transform 0.3s ease,
          box-shadow 0.3s ease;

      [data-theme="light"] .dynamic-login-card {

        animation: shine 3s linear infinite;

      }
    </style>

    <div class="login-bg-glow-1"></div>
    <div class="login-bg-glow-2"></div>

          z-index: 10;
          background: transparent;
          border-bottom: 1px solid transparent;
        ">
      <div class="container topbar-inner">
        <div class="brand">
          <div class="brand-icon"

          <div style="display: flex; justify-content: flex-end; margin-top: 30px">

      // ================================================================
      // 2. DATE & FORMATTING HELPERS
      // ================================================================
      const MONTH_NAMES = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December",
      ];

      function toCustomDateString(value) {
        if (!value) return "";
        let d = null;
        const customMatch = String(value)
          .trim()
          .match(/^(\d{1,2})\s+([A-Za-z]+),?\s+(\d{4})$/);
        if (customMatch) {
          const monthIdx = MONTH_NAMES.findIndex(
            (m) => m.toLowerCase() === customMatch[2].toLowerCase(),
          );
          if (monthIdx !== -1)
            d = new Date(
              Number(customMatch[3]),
              monthIdx,
              Number(customMatch[1]),
            );
        }
        if (!d) {
          const isoMatch = String(value).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
          if (isoMatch)
            d = new Date(
              Number(isoMatch[1]),
              Number(isoMatch[2]) - 1,
              Number(isoMatch[3]),
            );
        }
        if (!d) {
          const tmp = new Date(value);
          if (!isNaN(tmp.getTime())) d = tmp;
        }
        if (!d || isNaN(d.getTime())) return String(value);
        return `${d.getDate()} ${MONTH_NAMES[d.getMonth()]}, ${d.getFullYear()}`;
      }

      function toInputDateValue(value) {
        if (!value) return "";
        if (/^\d{4}-\d{2}-\d{2}$/.test(String(value).trim())) return value;
        const customMatch = String(value)
          .trim()
          .match(/^(\d{1,2})\s+([A-Za-z]+),?\s+(\d{4})$/);
        if (customMatch) {
          const monthIdx = MONTH_NAMES.findIndex(
            (m) => m.toLowerCase() === customMatch[2].toLowerCase(),
          );
          if (monthIdx !== -1) {
            const mm = String(monthIdx + 1).padStart(2, "0");
            const dd = String(Number(customMatch[1])).padStart(2, "0");
            return `${customMatch[3]}-${mm}-${dd}`;
          }
        }
        const d = new Date(value);
        if (!isNaN(d.getTime())) {
          const mm = String(d.getMonth() + 1).padStart(2, "0");
          const dd = String(d.getDate()).padStart(2, "0");
          return `${d.getFullYear()}-${mm}-${dd}`;
        }
        return "";
      }

      function calculateAge(dobString) {
        if (!dobString) return "";
        let d = null;
        const customMatch = String(dobString)
          .trim()
          .match(/^(\d{1,2})\s+([A-Za-z]+),?\s+(\d{4})$/);
        if (customMatch) {
          const monthIdx = MONTH_NAMES.findIndex(
            (m) => m.toLowerCase() === customMatch[2].toLowerCase(),
          );
          if (monthIdx !== -1)
            d = new Date(
              Number(customMatch[3]),
              monthIdx,
              Number(customMatch[1]),
            );
        }
        if (!d) d = new Date(dobString);
        if (!d || isNaN(d.getTime())) return "";
        const today = new Date();
        let age = today.getFullYear() - d.getFullYear();
        const m = today.getMonth() - d.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < d.getDate())) age--;
        return age >= 0 ? age : 0;
      }

      function formatBangladeshDate(dateString) {
        if (!dateString) return "—";
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return String(dateString);
        const options = {
          timeZone: "Asia/Dhaka",
          year: "numeric",
          month: "long",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: true,
        };
        try {
          return date.toLocaleString("en-US", options);
        } catch (e) {
          return String(dateString);
        }
      }

      // ================================================================
      // 3. UTILITY FUNCTIONS (Money, Escape, Toast)
      // ================================================================
      function renderPaymentBadge(
        isPaid,
        category,
        monthName,
        year,
        wazStartYear = "",
        wazEndYear = "",
      ) {
        const color = isPaid ? "#059669" : "#e11d48"; // Green or Red
        const bgColor = isPaid
          ? "rgba(5, 150, 105, 0.15)"
          : "rgba(225, 29, 72, 0.15)";

        let tooltip = "";
        if (category === "Waz Mahfil") {
          const yearRange =
            wazStartYear && wazEndYear
              ? `${wazStartYear} - ${wazEndYear}`
              : `${year}`;
          tooltip = `Waz Mahfil: ${yearRange} (${isPaid ? "Paid" : "Pending"})`;
        } else {
          tooltip = `${category}: ${monthName} ${year} (${isPaid ? "Paid" : "Pending"})`;
        }

        const tooltipPositionStyle =
          "bottom: 150%; top: auto; left: 50%; right: auto; transform: translateX(-50%); margin: 0;";
        const arrowPositionStyle =
          "top: 100%; bottom: auto; left: 50%; right: auto; margin-left: -5px; border-color: var(--card) transparent transparent transparent;";

        return `<div class="custom-tooltip-container" style="display:flex; justify-content:center; align-items:center;">
                <span style="display:inline-block; width:16px; height:16px; border-radius:50%; background-color:${color}; box-shadow: 0 0 0 3px ${bgColor};"></span>
                <span class="custom-tooltip-text" style="${tooltipPositionStyle}">${tooltip}</span>
                <style>
                  .custom-tooltip-container:hover .custom-tooltip-text::after {
                    ${arrowPositionStyle}
                  }
                </style>
              </div>`;
      }

      function money(value) {
        return (
          "৳" +
          Number(value || 0).toLocaleString("en-BD", {
            maximumFractionDigits: 2,
            minimumFractionDigits: 0,
          })
        );
      }

      function esc(value) {
        if (value === null || value === undefined) return "";
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function escMobile(value) {
        if (value === null || value === undefined || value === "") return "";
        return esc(String(value));
      }

      function toast(message, type) {
        let el = document.getElementById("customToast");
        if (!el) {
          el = document.createElement("div");
          el.id = "customToast";
          document.body.appendChild(el);
        }

        el.style.position = "fixed";
        el.style.top = "20px";
        el.style.left = "50%";
        el.style.transform = "translateX(-50%)";
        el.style.zIndex = "9999999";
        el.style.padding = "12px 24px";
        el.style.borderRadius = "8px";
        el.style.color = "#fff";
        el.style.fontWeight = "600";
        el.style.fontSize = "14px";
        el.style.boxShadow = "0 10px 25px rgba(0,0,0,0.2)";
        el.style.transition = "opacity 0.3s ease, top 0.3s ease";
        el.style.opacity = "0";
        el.style.top = "10px";

        if (type === "error") el.style.background = "#e11d48";
        else if (type === "success") el.style.background = "#059669";
        else el.style.background = "#0f172a";

        el.textContent = message;

        setTimeout(() => {
          el.style.opacity = "1";
          el.style.top = "20px";
        }, 10);

        clearTimeout(el._timer);
        el._timer = setTimeout(() => {
          el.style.opacity = "0";
          el.style.top = "10px";
        }, 3000);
      }

      // ================================================================
      // 4. LANGUAGE & THEME TOGGLES
      // ================================================================

      function updateLanguage() {
        const lang = "en";
        document.querySelectorAll("[data-en]").forEach((el) => {
          const target = el.getAttribute("data-en") || "";

          if (el.tagName === "INPUT" || el.tagName === "TEXTAREA") {
            el.placeholder = target;
            return;
          }

          if (!el.querySelector("*")) {
            el.textContent = target;
            return;
          }
          let replaced = false;
          for (let i = 0; i < el.childNodes.length; i++) {
            const node = el.childNodes[i];
            if (node.nodeType === Node.TEXT_NODE && node.textContent.trim()) {
              node.textContent = target;
              replaced = true;
              break;
            }
          }
          if (!replaced)
            el.insertBefore(document.createTextNode(target), el.firstChild);
        });
      }

      function toggleTheme() {
        theme = theme === "light" ? "dark" : "light";
        localStorage.setItem("sadanandapur_theme", theme);
        applyTheme();
      }

      function applyTheme() {
        document.documentElement.setAttribute("data-theme", theme);

        const themeBtn = $("themeBtn"),
          themeBtn2 = $("themeBtn2"),
          themeBtnLogin = $("themeBtnLogin");

        if (themeBtn) themeBtn.textContent = theme === "light" ? "🌙" : "☀️";
        if (themeBtn2) themeBtn2.textContent = theme === "light" ? "🌙" : "☀️";
        if (themeBtnLogin)
          themeBtnLogin.textContent = theme === "light" ? "🌙" : "☀️";
      }

      function loadTheme() {
        if (theme === "dark")
          document.documentElement.setAttribute("data-theme", "dark");
        else document.documentElement.setAttribute("data-theme", "light");
        applyTheme();
      }

      // ================================================================
      // 5. API CALLER
      // ================================================================
      async function api(functionName, args) {
        if (!API_URL || API_URL.includes("YOUR_GOOGLE"))
          throw new Error(
            "Please set your Google Apps Script Web App URL in the API_URL variable.",
          );
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            functionName: functionName,
            args: args || [],
          }),
        });
        const data = await response.json();
        if (!data.success) throw new Error(data.message || "Request failed.");
        return data.result;
      }

      function changePage(type, direction) {
        if (type === "global") {
          globalSearchPage += direction;
          renderSearchResultsPage();
        } else if (type === "collection") {
          collectionSearchPage += direction;
          renderCollectionResultsPage();
        } else if (type === "families") {
          if (!window.currentFamilyPage) window.currentFamilyPage = 1;
          window.currentFamilyPage += direction;
          renderFamilyTablePage(window.currentFamilyPage);
        } else if (type === "history") {
          historyPage += direction;
          renderHistoryResultsPage();
        } else if (type === "logs") {
          logsPage += direction;
          renderLogsPage();
        }
      }

      // ================================================================
      // 7. LOGIN / LOGOUT & SESSION
      // ================================================================
      function togglePasswordVisibility(inputId, iconContainer) {
        const input = document.getElementById(inputId);
        const eyeOpen = iconContainer.querySelector('#eyeOpen');
        const eyeClosed = iconContainer.querySelector('#eyeClosed');

        if (!input) return;

        if (input.type === "password") {
          input.type = "text";
          if (eyeOpen) eyeOpen.classList.add("hidden");
          if (eyeClosed) eyeClosed.classList.remove("hidden");
          iconContainer.style.color = "var(--primary)";
        } else {
          input.type = "password";
          if (eyeOpen) eyeOpen.classList.remove("hidden");
          if (eyeClosed) eyeClosed.classList.add("hidden");
          iconContainer.style.color = "var(--muted)";
        }
      }

      async function login(event) {
        event.preventDefault();
        const username = $("loginUsername").value.trim();
        const password = $("loginPassword").value;

        if (!username || !password) {
          toast("Username and password are required.", "error");
          return;
        }

        const btn = $("loginBtn");
        const btnText = $("loginBtnText");
        const spinner = $("loginSpinner");

        btn.disabled = true;
        if (btnText) btnText.textContent = "Logging in...";
        if (spinner) spinner.classList.remove("hidden");

        try {
          const result = await api("loginAdmin", [username, password]);

          if (!result || !result.token) {
            throw new Error("Invalid username or password.");
          }

          token = result.token;
          currentAdmin = result.admin;
          sessionStorage.setItem("sadanandapur_token", token);
          sessionStorage.setItem("sadanandapur_admin", JSON.stringify(currentAdmin));

          $("loginPage").classList.add("hidden");
          $("adminPage").classList.remove("hidden");

          initializeAdminUI();
          toast("Login successful.", "success");
        } catch (error) {
          let msg = error.message || "Login failed.";

          if (msg === "ALREADY_LOGGED_IN") {
            openModal(
              "⚠️ Already Logged In",
              `
                <div style="text-align:center; padding:10px;">
                  <div style="font-size:40px; margin-bottom:10px;">🔐</div>
                  <h4 style="margin-bottom:10px; font-size:18px;">Account is currently logged in</h4>
                  <p style="color:var(--muted); font-size:14px; line-height:1.6;">
                    This account is already logged in from another device/browser.<br>
                    If you want to login here anyway, the other session will be logged out.
                  </p>
                </div>
              `,
              `
                <button class="btn btn-light" onclick="closeModal()">Cancel</button>
                <button class="btn btn-danger" onclick='forceLogin("${username}", "${password}")'>Force Login</button>
              `
            );
          } else {
            if (msg.includes("Invalid")) msg = "Invalid username or password.";
            toast(msg, "error");
          }
        } finally {
          btn.disabled = false;
          if (btnText) btnText.textContent = "Login";
          if (spinner) spinner.classList.add("hidden");
        }
      }

      async function forceLogin(username, password) {
        closeModal();
        const btn = $("loginBtn");
        const btnText = $("loginBtnText");
        const spinner = $("loginSpinner");

        btn.disabled = true;
        if (btnText) btnText.textContent = "Force Logging in...";
        if (spinner) spinner.classList.remove("hidden");

        try {
          const result = await api("forceLoginAdmin", [username, password]);

          if (!result || !result.token) {
            throw new Error("Force login failed.");
          }

          token = result.token;
          currentAdmin = result.admin;
          sessionStorage.setItem("sadanandapur_token", token);
          sessionStorage.setItem("sadanandapur_admin", JSON.stringify(currentAdmin));

          $("loginPage").classList.add("hidden");
          $("adminPage").classList.remove("hidden");

          initializeAdminUI();
          toast("Force login successful. Previous session closed.", "success");
        } catch (error) {
          toast(error.message || "Force login failed.", "error");
        } finally {
          btn.disabled = false;
          if (btnText) btnText.textContent = "Login";
          if (spinner) spinner.classList.add("hidden");
        }
      }

      async function logout() {
        if (_logoutInProgress) return;
        _logoutInProgress = true;

        const btn = $("logoutBtn");
        const btnText = $("logoutBtnText");
        const spinner = $("logoutSpinner");

        if (btn) btn.disabled = true;
        if (btnText) btnText.textContent = "Logging out...";
        if (spinner) spinner.classList.remove("hidden");

        try {
          if (token) await api("logoutAdmin", [token]);
        } catch (e) { }

        token = "";
        currentAdmin = null;
        sessionStorage.removeItem("sadanandapur_token");
        sessionStorage.removeItem("sadanandapur_admin");
        sessionStorage.removeItem("sadanandapur_current_page");

        if ($("loginUsername")) $("loginUsername").value = "";
        if ($("loginPassword")) $("loginPassword").value = "";

        $("adminPage").classList.add("hidden");
        $("loginPage").classList.remove("hidden");

        toast("Logged out successfully.", "success");

        if (btn) btn.disabled = false;
        if (btnText) btnText.textContent = "Logout";
        if (spinner) spinner.classList.add("hidden");

        setTimeout(() => {
          _logoutInProgress = false;
        }, 500);
      }

      function initializeAdminUI() {
        if ($("userInfo"))
          $("userInfo").textContent =
            `${currentAdmin.name} · ${currentAdmin.role === "SUPER_ADMIN" ? "Super Admin" : currentAdmin.villagePart}`;
        if ($("superMenu")) {
          if (currentAdmin.role === "SUPER_ADMIN")
            $("superMenu").classList.remove("hidden");
          else $("superMenu").classList.add("hidden");
        }
        navigate(currentPage);
      }

      function toggleSidebar() {
        const sidebar = $("sidebar");
        const overlay = $("sidebarOverlay");

        if (!sidebar) return;

        sidebar.classList.toggle("open");

        if (sidebar.classList.contains("open")) {
          if (overlay) overlay.style.display = "block";
        } else {
          if (overlay) overlay.style.display = "none";
        }
      }

      function navigate(page) {
        currentPage = page;
        sessionStorage.setItem("sadanandapur_current_page", page);
        document.querySelectorAll(".nav-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.page === page);
        });
        if ($("sidebar")) $("sidebar").classList.remove("open");

        switch (page) {
          case "dashboard":
            renderDashboard();
            break;
          case "collection":
            renderCollection();
            break;
          case "history":
            renderHistory();
            break;
          case "families":
            renderFamilies();
            break;
          case "members":
            renderMembers();
            break;

      async function searchCollectionFamily(isDefaultLoad = false) {
        const query =
          isDefaultLoad === true
            ? ""
            : $("collectionSearchQuery").value.trim().toLowerCase();

        if (!window.allCollectionFamiliesData) {
          try {
            const families = await api("getAllFamiliesWithStatus", [token]);

            let settings = {};
            try {
              settings = await api("getSettings", [token]);
            } catch (e) { }

            let wazStartYear = "",
              wazEndYear = "";
            if (settings.WazMahfilStartDate) {
              const match = settings.WazMahfilStartDate.match(/\d{4}/);
              if (match) wazStartYear = match[0];
            }
            if (settings.WazMahfilEndDate) {
              const match = settings.WazMahfilEndDate.match(/\d{4}/);
              if (match) wazEndYear = match[0];
            }

            window.allCollectionFamiliesData = await Promise.all(
              families.map(async (family) => {
                try {
                  const status = await api("checkFamilyPaidThisMonth", [
                    token,
                    family.familyID,
                  ]);
                  let paidMasjid = false;
                  let paidMadrasha = false;
                  let paidWaz = false;

                  if (status.paid && status.collections) {
                    status.collections.forEach((c) => {
                      if (c.category === "Masjid") paidMasjid = true;
                      if (c.category === "Madrasha") paidMadrasha = true;
                      if (c.category === "Waz Mahfil") paidWaz = true;
                    });
                  }

                  return {
                    ...family,
                    paidMasjid,
                    paidMadrasha,
                    paidWaz,
                    wazStartYear: wazStartYear,
                    wazEndYear: wazEndYear,
                    thisMonthCollections: status.collections || [],
                  };
                } catch (e) {
                  return {
                    ...family,
                    paidMasjid: false,
                    paidMadrasha: false,
                    paidWaz: false,
                    wazStartYear: wazStartYear,
                    wazEndYear: wazEndYear,
                    thisMonthCollections: [],
                  };
                }
              }),
            );
          } catch (error) {
            handleApiError(error);
            return;
          }
        }

        let results = window.allCollectionFamiliesData;

        if (query) {
          results = results.filter((f) => {
            const id = String(f.familyID || "").toLowerCase();
            const name = String(f.mainPerson || "").toLowerCase();
            const mobile = String(f.mobile || "").toLowerCase();
            return (
              id.includes(query) ||
              name.includes(query) ||
              mobile.includes(query)
            );
          });
        }

        const paymentFilter = $("collectionPaymentFilter")
          ? $("collectionPaymentFilter").value
          : "ALL";

        let finalResults = results;
        if (paymentFilter === "PENDING") {
          finalResults = finalResults.filter(
            (f) => !f.paidMasjid || !f.paidMadrasha || !f.paidWaz,
          );
        } else if (paymentFilter === "PAID") {
          finalResults = finalResults.filter(
            (f) => f.paidMasjid && f.paidMadrasha && f.paidWaz,
          );
        }

        cachedCollectionSearchResults = finalResults;
        collectionSearchPage = 1;
        renderCollectionResultsPage();
      }

      async function loadHistory() {
        historyPage = 1;
        const filters = {
          month: $("historyMonth") ? $("historyMonth").value : "",
          year: $("historyYear") ? $("historyYear").value : "",
          category: $("historyCategory") ? $("historyCategory").value : "ALL",
          area: $("historyArea") ? $("historyArea").value : "ALL",
          search: $("historySearch") ? $("historySearch").value.trim() : "",
        };

        // Show spinner
        const btn = $("historySearchBtn");
        const icon = $("historySearchIcon");
        const spinner = $("historySearchSpinner");

        if (btn) btn.disabled = true;
        if (icon) icon.classList.add("hidden");
        if (spinner) spinner.classList.remove("hidden");

        try {
          cachedHistoryResults = await api("getFilteredCollectionHistory", [
            token,
            filters,
          ]);
          renderHistoryResultsPage();
        } catch (error) {
          handleApiError(error);
        } finally {
          // Hide spinner
          if (btn) btn.disabled = false;
          if (icon) icon.classList.remove("hidden");
          if (spinner) spinner.classList.add("hidden");
        }
      }

        const el = $("historyResults");
        if (!cachedHistoryResults.length) {
          el.innerHTML = `<div class="card"><div class="empty">No history found matching your filters.</div></div>`;

        }
        const totalPages =
          Math.ceil(cachedHistoryResults.length / ROWS_PER_PAGE) || 1;

        if (historyPage < 1) historyPage = 1;
        const startIdx = (historyPage - 1) * ROWS_PER_PAGE;

          startIdx,

        }
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function (e) {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {
              type: "array",
              cellText: true,
              cellNF: true,
              cellDates: true,
              raw: false,
            });
            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            let rows = XLSX.utils.sheet_to_json(worksheet, {
              header: 1,
              defval: "",
              raw: false,
              blankrows: false,
            });
            rows = rows.filter(
              (r) => r && r.some((c) => String(c).trim() !== ""),
            );
            if (!rows.length) {
              toast("File is empty.", "error");
              return;
            }

            const first = rows[0].map((c) => String(c).trim().toLowerCase());
            const isHeader =
              first[0].includes("main") ||
              first[0].includes("name") ||
              (first[1] && first[1].includes("mobile"));
            if (isHeader) rows = rows.slice(1);

            rows = rows.map((r) => {
              let mobile = String(r[1] || "").trim();
              const digitsOnly = mobile.replace(/[^0-9]/g, "");
              if (digitsOnly.length === 10 && !mobile.startsWith("0"))
                mobile = "0" + digitsOnly;
              return [
                String(r[0] || "").trim(),
                mobile,
                String(r[2] || "").trim(),
                toCustomDateString(String(r[3] || "").trim()),
                String(r[4] || "").trim(),
              ];
            });

            window._excelImportRows = rows;
            const table = $("previewTable"),
              thead = table.querySelector("thead"),
              tbody = table.querySelector("tbody");
            thead.innerHTML = `<tr><th>MainPerson</th><th>Mobile</th><th>Gender</th><th>DOB</th><th>Address</th></tr>`;
            tbody.innerHTML = rows
              .slice(0, 10)
              .map(
                (r) =>
                  `<tr><td>${esc(r[0])}</td><td>${escMobile(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td></tr>`,
              )
              .join("");

            if (rows.length > 10) {
              tbody.innerHTML += `<tr><td colspan="5" style="text-align:center;color:var(--muted);font-size:11px;">... ${rows.length - 10} more rows</td></tr>`;
            }

            $("previewCount").textContent = `(${rows.length} rows)`;
            $("excelPreview").classList.remove("hidden");
            $("importSubmitBtn").disabled = false;
            updateLanguage();
          } catch (err) {
            toast("Failed to read file.", "error");
          }
        };
        reader.readAsArrayBuffer(file);
      }

      async function submitExcelImport() {
        const area = $("importArea").value;
        const rows = window._excelImportRows || [];

        if (!rows.length) {
          toast("No rows to import.", "error");
          return;
        }

        const btn = $("importSubmitBtn");
        const oldBtnHTML = btn ? btn.innerHTML : "";

        if (btn) {
          btn.disabled = true;
          btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite; display:inline-block; vertical-align:middle; margin-right:6px;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg> Importing...`;
        }

        try {
          const payload = rows
            .map((r) => {
              let mobile = String(r[1] || "").trim();
              const dOnly = mobile.replace(/[^0-9]/g, "");
              if (dOnly.length === 10 && !mobile.startsWith("0"))
                mobile = "0" + dOnly;
              const safe = (s) =>
                s.startsWith("=") || s.startsWith("+") ? "'" + s : s;
              return [
                safe(String(r[0] || "").trim()),
                safe(mobile),
                safe(String(r[2] || "").trim()),
                safe(toCustomDateString(String(r[3] || "").trim())),
                safe(String(r[4] || "").trim()),
              ];
            })
            .filter((r) => r[0] || r[1] || r[4]);

          const result = await api("importFamiliesBulk", [
            token,
            area,
            payload,
          ]);

          $("importResult").classList.remove("hidden");
          $("importResult").innerHTML = `
      <div style="background:rgba(5,150,105,0.1);border:1px solid var(--success);border-radius:12px;padding:14px;">

          <div>⏭️ <b>Skipped (duplicate):</b> ${result.skipped}</div>
        </div>
      </div>
    `;

          setTimeout(() => {
            closeModal();
            renderFamilies();

        } catch (error) {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = oldBtnHTML;
            updateLanguage();
          }
          handleApiError(error);
        }
      }

      function previewMemberExcelImport() {
        const input = $("memberExcelFileInput");
        if (!input || !input.files || !input.files.length) return;
        if (typeof XLSX === "undefined") {
          toast("Excel library not loaded.", "error");
          return;
        }
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function (e) {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {
              type: "array",
              cellText: true,
              cellNF: true,
              cellDates: true,
              raw: false,
            });
            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            let rows = XLSX.utils.sheet_to_json(worksheet, {
              header: 1,
              defval: "",
              raw: false,
              blankrows: false,
            });
            rows = rows.filter(
              (r) => r && r.some((c) => String(c).trim() !== ""),
            );
            if (!rows.length) {
              toast("File is empty.", "error");
              return;
            }

            const first = rows[0].map((c) => String(c).trim().toLowerCase());
            const isHeader =
              first[0].includes("name") || first[1].includes("relation");
            if (isHeader) rows = rows.slice(1);

            rows = rows.map((r) => {
              return [
                String(r[0] || "").trim(),
                String(r[1] || "").trim(),
                toCustomDateString(String(r[2] || "").trim()),
                String(r[3] || "").trim(),
                String(r[4] || "").trim(),
              ];
            });

            window._memberExcelImportRows = rows;
            const table = $("memberPreviewTable"),
              thead = table.querySelector("thead"),
              tbody = table.querySelector("tbody");
            thead.innerHTML = `<tr><th>Name</th><th>Relation</th><th>Date of Birth</th><th>Gender</th><th>Address</th></tr>`;
            tbody.innerHTML = rows
              .slice(0, 10)
              .map(
                (r) =>
                  `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td></tr>`,
              )
              .join("");

            if (rows.length > 10) {
              tbody.innerHTML += `<tr><td colspan="5" style="text-align:center;color:var(--muted);font-size:11px;">... ${rows.length - 10} more rows</td></tr>`;
            }

            $("memberPreviewCount").textContent = `(${rows.length} rows)`;
            $("memberExcelPreview").classList.remove("hidden");
            $("memberImportSubmitBtn").disabled = false;
            updateLanguage();
          } catch (err) {
            toast("Failed to read file.", "error");
          }
        };
        reader.readAsArrayBuffer(file);
      }

      async function submitMemberExcelImport() {
        const familyID = window._currentImportFamilyID;
        const rows = window._memberExcelImportRows || [];

        if (!rows.length) {
          toast("No rows to import.", "error");
          return;
        }

        const btn = $("memberImportSubmitBtn");
        const oldBtnHTML = btn ? btn.innerHTML : "";

        if (btn) {
          btn.disabled = true;
          btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite; display:inline-block; vertical-align:middle; margin-right:6px;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg> Importing...`;
        }

        try {
          const payload = rows
            .map((r) => {
              const safe = (s) =>
                s.startsWith("=") || s.startsWith("+") ? "'" + s : s;
              return [
                safe(String(r[0] || "").trim()),
                safe(String(r[1] || "").trim()),
                safe(toCustomDateString(String(r[2] || "").trim())),
                safe(String(r[3] || "").trim()),
                safe(String(r[4] || "").trim()),
              ];
            })
            .filter((r) => r[0]);

          const result = await api("importMembersBulk", [
            token,
            familyID,
            payload,
          ]);

          $("memberImportResult").classList.remove("hidden");
          $("memberImportResult").innerHTML = `
      <div style="background:rgba(5,150,105,0.1);border:1px solid var(--success);border-radius:12px;padding:14px;">
        <div style="font-weight:800;color:var(--success);margin-bottom:6px;">✅ Import Complete</div>
        <div style="font-size:13px;line-height:1.6;">
          <div>📥 <b>Imported:</b> ${result.imported} members</div>
        </div>
      </div>
    `;
          toast("Members imported successfully.", "success");

          setTimeout(() => {
            closeModal();
            loadMembers();
          }, 1500);

        } catch (error) {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = oldBtnHTML;
            updateLanguage();
          }
          handleApiError(error);
        }
      }

      async function downloadReceiptJPG() {
        const receiptEl = document.querySelector("#modalBody .receipt");
        if (!receiptEl) {
          toast("No receipt to download.", "error");
          return;
        }
        if (typeof html2canvas !== "function") {
          toast("JPG library not loaded.", "error");
          return;
        }
        const button = document.querySelector(
          '#modalFooter button[onclick*="downloadReceiptJPG"]',
        );
        const oldButtonHTML = button ? button.innerHTML : "";

        try {
          if (button) {
            button.disabled = true;
            button.innerHTML = "⏳ Generating JPG...";
          }
          const clone = receiptEl.cloneNode(true);
          clone.id = "jpgReceiptClone";

          Object.assign(clone.style, {
            width: "500px",
            maxWidth: "500px",
            margin: "0",
            padding: "35px 40px",
            background: "#ffffff",
            borderRadius: "16px",
            boxShadow: "0 4px 20px rgba(0,0,0,0.08)",
            border: "1px solid #e2e8f0",
            fontFamily: '"Exo 2", "Hind Siliguri", sans-serif',
            color: "#1a1a2e",
          });

          const cloneRows = clone.querySelectorAll(".receipt-row");
          cloneRows.forEach((row) => {
            row.style.padding = "10px 0";
            row.style.gap = "20px";
            row.style.fontFamily = '"Exo 2", "Hind Siliguri", sans-serif';
          });

          const cloneItems = clone.querySelectorAll(".receipt-items");
          cloneItems.forEach((item) => {
            item.style.padding = "15px 20px";
            item.style.margin = "20px 0";
            item.style.maxHeight = "none";
            item.style.overflowY = "visible";
            item.style.fontFamily = '"Exo 2", "Hind Siliguri", sans-serif';
          });

          const container = document.createElement("div");
          Object.assign(container.style, {
            position: "fixed",
            left: "-10000px",
            top: "0",
            width: "600px",
            padding: "30px",
            background: "#ffffff",
            zIndex: "-1",
            fontFamily: '"Exo 2", "Hind Siliguri", sans-serif',
          });

          container.appendChild(clone);
          document.body.appendChild(container);

          if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
          }

          const canvas = await html2canvas(container, {
            scale: Math.max(2, window.devicePixelRatio || 1),
            useCORS: true,
            allowTaint: false,
            backgroundColor: "#ffffff",
            logging: false,
            imageTimeout: 15000,
            height: container.scrollHeight,
            windowHeight: container.scrollHeight,
            onclone: function (clonedDoc) {
              const el = clonedDoc.getElementById("jpgReceiptClone");
              if (el) {
                el.style.fontFamily = '"Exo 2", "Hind Siliguri", sans-serif';
                const allNodes = el.querySelectorAll('*');
                allNodes.forEach(node => {
                  node.style.fontFamily = '"Exo 2", "Hind Siliguri", sans-serif';
                });
              }
            }
          });

          const dataUrl = canvas.toDataURL("image/jpeg", 0.95);
          const link = document.createElement("a");

          const safeReceiptNo =
            lastReceipt && lastReceipt.collectionID
              ? String(lastReceipt.collectionID).replace(/[^a-zA-Z0-9_-]/g, "_")
              : "receipt";
          const date = new Date().toISOString().slice(0, 10);

          link.href = dataUrl;
          link.download = `receipt_${safeReceiptNo}_${date}.jpg`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          container.remove();

          if (lastReceipt && lastReceipt.isFromCollection) {
            window.location.reload();
          } else {
            closeModal();
            toast("JPG downloaded successfully.", "success");
            if (button) {
              button.disabled = false;
              button.innerHTML = oldButtonHTML;
            }
          }
        } catch (error) {
          console.error("JPG generation error:", error);
          const c = document.getElementById("jpgReceiptClone");
          if (c && c.parentElement) c.parentElement.remove();
          toast("Failed to generate JPG. Please try again.", "error");

          if (button) {
            button.disabled = false;
            button.innerHTML = oldButtonHTML;
          }
        }
      }
